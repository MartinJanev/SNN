# Unified experiment configuration

experiment:
  language: "anbn"
  output_dir: "outputs"
  stratified_test: false
  difficulty_test: false
  pairs_per_bucket: 50
  pairs_per_difficulty_cell: 5

training:
  train_pairs: 250
  test_pairs: 150
  train_min_n: 1
  train_max_n: 10
  test_min_n: 1
  test_max_n: 80
  epochs: 5
  learning_rate: 0.01
  seed: 42

model:
  hidden_size: 32
  beta: 0.85
  learn_beta: true

device:
  device: null
