experiment:
  language: "anbn"
  output_dir: "outputs/experiments/exp2_beta"
  stratified_test: false
  difficulty_test: false

training:
  train_pairs: 1500
  test_pairs: 250
  train_min_n: 1
  train_max_n: 20
  train_max_word_len: 40
  test_min_n: 1
  test_max_n: 80
  epochs: 30
  learning_rate: 0.001
  val_fraction: 0.1
  patience: 4
  grad_clip: 1.0
  seed: 42

model:
  hidden_size: 32
  match_capacity: true
  beta: 0.85
  learn_beta: false

device:
  device: null
