experiment:
  language: "anbn"
  output_dir: "outputs/experiments/exp1_length"
  stratified_test: true
  difficulty_test: false
  pairs_per_bucket: 50

training:
  train_pairs: 1500
  train_min_n: 1
  train_max_n: 20
  train_max_word_len: 40
  epochs: 30
  learning_rate: 0.001
  val_fraction: 0.1
  patience: 4
  grad_clip: 1.0
  seed: 42

model:
  hidden_size: 32
  match_capacity: true
  beta: 0.85
  learn_beta: true

device:
  device: null
