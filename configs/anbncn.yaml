# Context-sensitive language study configuration
# Run with: python main.py --config config_anbncn.yaml

experiment:
  language: "anbncn"

training:
  train_pairs: 300
  test_pairs: 150
  train_min_n: 1
  train_max_n: 4
  test_min_n: 5
  test_max_n: 9
  epochs: 15
  learning_rate: 0.01
  seed: 42

model:
  hidden_size: 24
  beta: 0.9

device:
  device: null

